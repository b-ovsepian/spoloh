{{define "title"}}Вхід — Spoloh{{end}}
{{define "content"}}
<div class="card mx-auto max-w-sm p-6">
  <header class="mb-4">
    <h1 class="text-lg font-semibold">Вхід до Spoloh</h1>
  </header>
  {{if .Error}}
  <div class="alert mb-4" data-variant="destructive" role="alert">
    <section><p>{{.Error}}</p></section>
  </div>
  {{end}}
  <form method="post" action="/login" class="grid gap-4">
    <div class="field">
      <label for="password">Пароль</label>
      <input class="input" type="password" id="password" name="password" required autofocus>
    </div>
    <button class="btn" type="submit">Увійти</button>
  </form>
</div>
{{end}}
