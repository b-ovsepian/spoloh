name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # make dist takes its version from git describe
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      # release fires on the same tag push as ci.yml, in a separate workflow
      # with no dependency between them, so ci.yml going red must not leave
      # this one free to publish anyway. Re-running its gate here removes
      # that unstated "the tagged commit already passed CI" assumption.
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go test ./... -race
      - run: make dist
      # Every file in dist/ is an asset, SHA256SUMS included: install.sh and
      # the updater both fetch it to verify what they downloaded.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # This workflow triggers on v*, which matches v1.5.0-rc1, and the
          # updater follows /releases/latest. Without this, tagging a release
          # candidate publishes it as the latest release and every school
          # device installs it — nothing but discipline stood between the two.
          # A tag carrying a pre-release suffix (anything with a hyphen, the
          # semver convention) publishes as a pre-release, which /latest skips.
          prerelease: ${{ contains(github.ref_name, '-') }}
