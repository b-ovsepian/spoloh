name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go test ./... -race
      # Cross-compiling every board on every push is what catches a change
      # that quietly needs cgo. It costs seconds and the alternative is
      # finding out at tag time.
      - run: make dist
